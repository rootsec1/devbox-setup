name: Bug report
description: Report a reproducible provisioning or validation problem
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: target
    attributes:
      label: Target
      description: Ubuntu version, architecture, and hosting environment
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Remove hostnames, usernames, keys, tokens, and other secrets.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I removed credentials and identifying information.
          required: true
